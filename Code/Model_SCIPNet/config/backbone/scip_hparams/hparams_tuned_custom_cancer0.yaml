# @package _global_
dataset:
  coeff: 4.0 #10.0
  treatment_mode: multilabel
  fill_missing: False


model:

  propensity_treatment:
    num_layer: 2
    batch_size: 128
    seq_hidden_units: 8 #2.0*4
    dropout_rate: 0.1
    max_grad_norm: 0.5
    optimizer:
      learning_rate: 0.0001

  propensity_history:
    num_layer: 1
    batch_size: 64
    seq_hidden_units: 12 #3.0*4
    dropout_rate: 0.1
    max_grad_norm: 0.5
    optimizer:
      learning_rate: 0.01

  encoder:
    num_layer: 1
    batch_size: 64
    seq_hidden_units: 8 #2.0*4
    dropout_rate: 0.1
    max_grad_norm: 0.5
    optimizer:
      learning_rate: 0.01  

  train_decoder: True
  decoder:
    num_layer: 2
    batch_size: 256
    seq_hidden_units: 32 #8.0*4
    dropout_rate: 0.1
    max_grad_norm: 1.0
    optimizer:
      learning_rate: 0.001

exp:
  max_epochs: 50      
